name: Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing git tag to publish, for example v1.0.0
        required: true
        default: v1.0.0

# 发布流程需要写入 GitHub Release 资产；其余权限保持默认最小化。
permissions:
  contents: write

# 同一个 tag 只保留一个发布任务，防止手动触发和 tag push 同时上传重复资产。
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      # npm ci 只接受锁文件中的版本，用于保证发布前端依赖可复现。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          // 读取三个发布元数据来源，确保 Git tag 与应用内版本号保持一致。
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'))
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8')
          const cargoVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1]
          const releaseTag = process.env.RELEASE_TAG
          const expectedTag = `v${pkg.version}`
          const errors = []

          // 任一来源不一致都会终止发布，避免上传版本标签错误的安装包。
          if (releaseTag !== expectedTag) {
            errors.push(`tag ${releaseTag} 与 package.json 版本 ${pkg.version} 不匹配，应为 ${expectedTag}`)
          }

          if (tauri.version !== pkg.version) {
            errors.push(`tauri.conf.json 版本 ${tauri.version} 与 package.json 版本 ${pkg.version} 不一致`)
          }

          if (cargoVersion !== pkg.version) {
            errors.push(`Cargo.toml 版本 ${cargoVersion ?? '未读取到'} 与 package.json 版本 ${pkg.version} 不一致`)
          }

          if (errors.length > 0) {
            console.error(errors.join('\n'))
            process.exit(1)
          }

          console.log(`发布版本校验通过：${releaseTag}`)
          NODE

      - name: Run unit tests
        run: npm test

      - name: Type-check and build frontend
        run: npm run build

  publish-tauri:
    name: Build ${{ matrix.platform }} package
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 分成 Apple Silicon 与 Intel 两个目标，分别产出对应架构安装包。
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          # Linux 与 Windows 使用 runner 原生目标，避免跨平台打包引入额外系统依赖。
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      # Linux runner 打包 Tauri 桌面应用时需要 WebKitGTK、AppIndicator、SVG 和 patchelf。
      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # npm 缓存依赖 package-lock.json，发布产物与本仓库锁文件绑定。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # 每个平台独立缓存 Cargo target，降低 tag 发布时的重复编译成本。
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action 会调用 Tauri CLI 构建原生包，并把生成的安装包上传到同一个 GitHub Release。
      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: Recipe Designer ${{ inputs.release_tag || github.ref_name }}
          releaseBody: |
            Recipe Designer ${{ inputs.release_tag || github.ref_name }} 正式发布。

            此 Release 由 GitHub Actions 自动构建并上传 Windows、macOS 与 Linux 安装包。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 2
          args: ${{ matrix.args }}
