[package]
name = "tauri-apprecipe-designer"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# Cargo 清单定义 Rust 包元数据、构建产物和依赖来源。

[lib]
# `_lib` 后缀用于让库目标名与二进制目标名保持唯一，避免 Windows 平台上的 Cargo 目标名冲突。
name = "tauri_apprecipe_designer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
